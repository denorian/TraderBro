databaseChangeLog:
  - changeSet:
      id: 20261012-1
      author: a.s.brovko
      comment: Stage 3 — per-bar indicator snapshots for the Alligator and Awesome Oscillator.
      changes:
        - createTable:
            tableName: indicator_snapshots
            remarks: Per-bar Williams Alligator / Awesome Oscillator snapshots for the monitoring UI.
            columns:
              - column:
                  name: figi
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: interval
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: ts
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: indicator
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: values
                  type: JSONB
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: indicator_snapshots
            columnNames: figi, interval, ts, indicator
            constraintName: pk_indicator_snapshots
        - createIndex:
            indexName: idx_indicator_snapshots_ts
            tableName: indicator_snapshots
            columns:
              - column:
                  name: ts
        - createIndex:
            indexName: idx_indicator_snapshots_figi_latest
            tableName: indicator_snapshots
            columns:
              - column:
                  name: figi
              - column:
                  name: interval
              - column:
                  name: ts