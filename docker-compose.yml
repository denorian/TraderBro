services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: traderbro-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traderbro}
      POSTGRES_USER: ${POSTGRES_USER:-traderbro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traderbro}
    ports:
      - "25432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traderbro} -d ${POSTGRES_DB:-traderbro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applies Liquibase migrations before the app starts.
  # Equivalent to: scripts/migrate.sh
  migrate:
    image: liquibase/liquibase:${LIQUIBASE_VERSION:-4.31.1}
    container_name: traderbro-migrate
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - ./migrations:/liquibase/changelog
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://timescaledb:5432/${POSTGRES_DB:-traderbro}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-traderbro}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-traderbro}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.sql
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
    command: update
    restart: "no"

volumes:
  timescaledb-data: