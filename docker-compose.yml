services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: traderbro-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traderbro}
      POSTGRES_USER: ${POSTGRES_USER:-traderbro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traderbro}
    ports:
      - "25432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traderbro} -d ${POSTGRES_DB:-traderbro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applies Liquibase migrations before the app starts.
  # Equivalent to: scripts/migrate.sh
  migrate:
    image: liquibase/liquibase:${LIQUIBASE_VERSION:-4.31.1}
    container_name: traderbro-migrate
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - ./migrations:/liquibase/changelog
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://timescaledb:5432/${POSTGRES_DB:-traderbro}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-traderbro}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-traderbro}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.yaml
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
    command: update
    restart: "no"

  # Spring Boot backend (serves the REST API, not the UI — the UI is in the frontend container).
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: traderbro-backend:latest
    container_name: traderbro-backend
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-traderbro}
      POSTGRES_USER: ${POSTGRES_USER:-traderbro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traderbro}
      # Secrets are passed through from the host environment (see .env).
      TBANK_TOKEN: ${TBANK_TOKEN:-}
      TB_API_KEY: ${TB_API_KEY:-}
      APP_SANDBOX: ${APP_SANDBOX:-true}
      APP_OBSERVE_ONLY: ${APP_OBSERVE_ONLY:-false}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      MONITORING_PORT: "8080"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Angular UI served by nginx; proxies /api to the backend container.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: traderbro-frontend:latest
    container_name: traderbro-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  timescaledb-data: