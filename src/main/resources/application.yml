# TraderBro — application configuration
# All secrets come from environment variables; never place real tokens here.

app:
  sandbox: ${APP_SANDBOX:true}                 # live trading requires TRADING_LIVE_ACK env
  account-id: ${APP_ACCOUNT_ID:}               # required in live mode (blank = auto/open sandbox)
  observe-only: ${APP_OBSERVE_ONLY:false}      # signals-only: publish signals, never place orders
  money-scale: 4
  max-bars-in-memory: 500
  indicator-threads: 4
  history:
    load-on-startup: ${HISTORY_LOAD_ON_STARTUP:false}
    daily-years: 3
    intraday-days: 90
    intraday-interval: FIFTEEN_MIN

tbank:
  token-env: TBANK_TOKEN
  target: invest-public-api.tinkoff.ru
  timeout: 10s
  retry:
    max-attempts: 3
    initial-backoff: 500ms

instruments:
  tickers: [SBER, GAZP, LKOH, YDEX, VTBR, T, PLZL, NVTK, ROSN, TATN, GMKN, MOEX, X5]

strategies:
  SmaCrossStrategy:
    enabled: true
    interval: ONE_DAY
    order-type: LIMIT
    max-position-pct: 0.10
    params:
      fast: "20"
      slow: "100"
  EmaMomentumStrategy:
    enabled: true
    interval: FIFTEEN_MIN
    order-type: LIMIT
    max-position-pct: 0.10
    params:
      fastEm: "12"
      slowEm: "26"
      rsiPeriod: "14"
      rsiMin: "30"
      rsiMax: "70"
      atrPeriod: "14"
      atrMult: "2"
  AlligatorAoStrategy:
    enabled: ${ALLIGATOR_AO_ENABLED:true}
    interval: ONE_HOUR
    order-type: LIMIT
    max-position-pct: 0.10
    params:
      fast: "5"
      slow: "34"
      entanglementAtrThreshold: "0.5"
      stopLookback: "5"
      allowShort: "true"
      atrPeriod: "14"

indicators:
  alligator:
    jaw-period: 13
    jaw-shift: 8
    teeth-period: 8
    teeth-shift: 5
    lips-period: 5
    lips-shift: 3
    atr-period: 14
    entanglement-atr-threshold: 0.5
  awesome-oscillator:
    fast: 5
    slow: 34
  snapshot-retention-days: 90
  snapshot-timeframes: [FIFTEEN_MIN, ONE_HOUR, ONE_DAY]
  recent-catchup-hours: 48
  catch-up-ms: 300000
  retention-cron: "0 15 3 * * *"

ui:
  enabled: true
  poll-interval-ms: 10000
  chart-default-bars: 500
  build-profile: build-ui

risk:
  daily-loss-limit-pct: 0.02
  position-limit-pct: 0.10
  exposure-limit-pct: 0.50
  max-order-rate-per-minute: 10
  trading-window-start: "10:00"
  trading-window-end: "18:40"
  allow-weekend-trading: false
  max-stream-lag: 60s
  trading-zone: Europe/Moscow

execution:
  order-ttl: 60s
  auto-kill-on-reconcile-discrepancy: true
  liquidate-on-kill: false

futures:
  enabled: true
  # Basic assets matched against the SDK's Future.basicAsset. IMOEX corresponds to the
  # MIX contract (MOEX index futures); the traded ticker differs from the basic asset.
  basic-assets: [IMOEX, BR, GOLD, CR]
  min-days-to-expiry: 7
  rollover-days-before: 5
  no-new-positions-days-before-expiry: 2

telegram:
  enabled: ${TELEGRAM_ENABLED:false}
  bot-token-env: TELEGRAM_BOT_TOKEN
  chat-id-env: TELEGRAM_CHAT_ID
  min-level: INFO
  max-messages-per-minute: 20
  retry-attempts: 3
  worker-poll-ms: 5000

scheduler:
  reconcile-ms: 60000
  strategy-reload-ms: 300000
  portfolio-snapshot-ms: 300000
  instrument-refresh-cron: "0 0 8 * * *"
  staleness-monitor-ms: 10000
  futures-rollover-cron: "0 0 9 * * *"

monitoring:
  port: 8080
  api-key-env: TB_API_KEY

spring:
  application:
    name: traderbro
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:traderbro}
    username: ${POSTGRES_USER:traderbro}
    password: ${POSTGRES_PASSWORD:traderbro}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always

server:
  port: ${MONITORING_PORT:8080}

logging:
  config: classpath:logback-spring.xml
  level:
    com.traderbro: INFO
    ru.tinkoff.piapi: WARN