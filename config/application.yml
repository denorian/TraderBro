# TraderBro — sample configuration (copy to your runtime, override via env).
# The canonical runtime config lives in src/main/resources/application.yml.
# Secrets (TBANK_TOKEN, TB_API_KEY) are read from environment variables only.

app:
  sandbox: ${APP_SANDBOX:true}
  account-id: ${APP_ACCOUNT_ID:}
  observe-only: ${APP_OBSERVE_ONLY:false}

backtest:
  executor-pool-size: 2
  default-commission-pct: 0.05
  default-slippage-bps: 5
  max-signals-per-run: 100000
  results-retention-days: 180
  retention-cron: "0 30 3 * * *"
  walk-forward:
    train-days: 180
    test-days: 60

tbank:
  token-env: TBANK_TOKEN
  timeout: 10s

instruments:
  tickers: [SBER, GAZP, LKOH, YDEX, VTBR, TCSG, PLZL, NVTK, ROSN, TATN, GMKN, MOEX, X5, SIBN, TRNFP, SPBE]

risk:
  daily-loss-limit-pct: 0.02
  position-limit-pct: 0.10
  exposure-limit-pct: 0.50

execution:
  order-ttl: 60s

indicators:
  alligator:
    jaw-period: 13
    jaw-shift: 8
    teeth-period: 8
    teeth-shift: 5
    lips-period: 5
    lips-shift: 3
    atr-period: 14
    entanglement-atr-threshold: 0.5
  awesome-oscillator:
    fast: 5
    slow: 34
  snapshot-retention-days: 90
  snapshot-timeframes: [FIFTEEN_MIN, ONE_HOUR, FOUR_HOUR, ONE_DAY]
  recent-catchup-hours: 48

williams:
  divergence:
    ao-peak-window: 2
    min-peak-distance: 5
    max-peak-distance: 60
    min-peak-abs-atr: 0.2
    confirm-bars: 10
  angulation:
    lookback-bars: 60
    threshold-atr-per-bar: 0.05
    events-lookback-bars: 30

strategies:
  ao-divergence:
    enabled: false
    timeframes: [FIFTEEN_MIN, ONE_HOUR]
    stop-buffer-atr: 0.3
    risk-capital-pct: 1
    allow-short: true
    atr-period: 14

ui:
  enabled: true
  poll-interval-ms: 10000
  chart-default-bars: 500
  build-profile: build-ui

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:traderbro}
    username: ${POSTGRES_USER:traderbro}
    password: ${POSTGRES_PASSWORD:traderbro}