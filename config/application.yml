# TraderBro — sample configuration (copy to your runtime, override via env).
# The canonical runtime config lives in src/main/resources/application.yml.
# Secrets (TBANK_TOKEN, TB_API_KEY) are read from environment variables only.

app:
  sandbox: ${APP_SANDBOX:true}
  account-id: ${APP_ACCOUNT_ID:}
  observe-only: ${APP_OBSERVE_ONLY:false}

backtest:
  executor-pool-size: 2
  default-commission-pct: 0.05
  default-slippage-bps: 5
  max-signals-per-run: 100000
  results-retention-days: 180
  retention-cron: "0 30 3 * * *"
  walk-forward:
    train-days: 180
    test-days: 60

tbank:
  token-env: TBANK_TOKEN
  timeout: 10s

instruments:
  tickers: [SBER, GAZP, LKOH, YDEX, VTBR, TCSG, PLZL, NVTK, ROSN, TATN, GMKN, MOEX, X5, SIBN, TRNFP, SPBE]

crypto:
  enabled: ${CRYPTO_ENABLED:true}
  binance:
    base-url: https://api.binance.com
    ws-url: wss://stream.binance.com:9443
    rate-limit-weight-per-min: 1100
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
  pairs: [BTCUSDT, ETHUSDT, BNBUSDT, SOLUSDT, XRPUSDT]
  timeframes: [FIFTEEN_MIN, ONE_HOUR, FOUR_HOUR, ONE_DAY]
  history:
    load-on-startup: ${CRYPTO_HISTORY_LOAD_ON_STARTUP:true}
    days-daily: 1095
    days-intraday: 90
    days-hourly: 400
  taker-fee-pct: 0.1
  slippage-bps: 5
  coingecko:
    enabled: ${COINGECKO_ENABLED:true}
    base-url: https://api.coingecko.com/api/v3
    update-cron: "0 0 8 * * *"

risk:
  daily-loss-limit-pct: 0.02
  position-limit-pct: 0.10
  exposure-limit-pct: 0.50

execution:
  order-ttl: 60s

indicators:
  alligator:
    jaw-period: 13
    jaw-shift: 8
    teeth-period: 8
    teeth-shift: 5
    lips-period: 5
    lips-shift: 3
    atr-period: 14
    entanglement-atr-threshold: 0.5
  awesome-oscillator:
    fast: 5
    slow: 34
  snapshot-retention-days: 90
  snapshot-timeframes: [FIFTEEN_MIN, ONE_HOUR, FOUR_HOUR, ONE_DAY]
  recent-catchup-hours: 48

williams:
  divergence:
    ao-peak-window: 2
    min-peak-distance: 5
    max-peak-distance: 60
    min-peak-abs-atr: 0.2
    confirm-bars: 10
  angulation:
    lookback-bars: 60
    threshold-atr-per-bar: 0.05
    events-lookback-bars: 30

strategies:
  ao-divergence:
    enabled: false
    timeframes: [FIFTEEN_MIN, ONE_HOUR]
    stop-buffer-atr: 0.3
    risk-capital-pct: 1
    allow-short: true
    atr-period: 14

ui:
  enabled: true
  poll-interval-ms: 10000
  chart-default-bars: 500
  build-profile: build-ui

# Stage 4.0 — personal Telegram account ingestion ("Анализ сигналов").
# Secrets come only from env: TELEGRAM_API_ID, TELEGRAM_API_HASH, TELEGRAM_PHONE_NUMBER,
# TELEGRAM_TDLIB_DATABASE_ENCRYPTION_KEY. Login code / 2FA password are entered interactively
# (profile signal-auth) and never stored.
signal-analysis:
  enabled: true
  api:
    default-page-size: 50
    max-page-size: 200
    channel-list-refresh-ms: 30000
    status-refresh-ms: 10000
  ingestion:
    enabled: ${SIGNAL_ANALYSIS_INGESTION_ENABLED:false}
    # Local dev default: ./telegram-user (writable, git-ignored). Docker overrides these via
    # TELEGRAM_TDLIB_DB_DIR / TELEGRAM_TDLIB_FILES_DIR to the /var/lib/traderbro/telegram-user volume.
    session-database-directory: ${TELEGRAM_TDLIB_DB_DIR:./telegram-user/tdlib-db}
    session-files-directory: ${TELEGRAM_TDLIB_FILES_DIR:./telegram-user/files}
    database-encryption-key: ${TELEGRAM_TDLIB_DATABASE_ENCRYPTION_KEY:}
    api-id: ${TELEGRAM_API_ID:0}
    api-hash: ${TELEGRAM_API_HASH:}
    phone-number: ${TELEGRAM_PHONE_NUMBER:}
    monitoring-poll-interval: 5s
    inbox:
      queue-capacity: 10000
      claim-batch-size: 100
      max-attempts: 10
      initial-retry-delay: 2s
      max-retry-delay: 5m
      raw-event-retention-days: 30
      cleanup-interval: 1h
    discovery:
      page-size: 100
      sync-interval: 15m
      completion-timeout: 2m
    history:
      enabled: true
      page-size: 100
      full-backfill-enabled: true
      max-concurrent-channel-backfills: 1
      tail-size: 100
      tail-sync-interval: 5m
      request-pacing-delay: 1500ms
      max-no-progress-pages: 3
    lifecycle:
      heartbeat-interval: 10s
      heartbeat-timeout: 45s
      callback-threads: 1
      inbox-threads: 2
      history-threads: 2

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:traderbro}
    username: ${POSTGRES_USER:traderbro}
    password: ${POSTGRES_PASSWORD:traderbro}